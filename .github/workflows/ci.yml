name: CI

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.23.2
          cache: false

      - name: Validate repository
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit
          npm run build --workspace=packages/core
          npm test
          npm run lint --workspace=packages/core
          git diff --check '${{ github.event.pull_request.base.sha }}...HEAD'

      - name: Scan full history for secrets
        shell: bash
        run: |
          set -euo pipefail
          readonly version='8.30.1'
          readonly checksum='551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
          readonly archive="$RUNNER_TEMP/gitleaks-$version.tar.gz"
          readonly install_dir="$RUNNER_TEMP/gitleaks-$version"
          mkdir -m 700 "$install_dir"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$version/gitleaks_${version}_linux_x64.tar.gz"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$install_dir" gitleaks
          "$install_dir/gitleaks" git --redact --no-banner --exit-code 1 --log-opts='--all'
